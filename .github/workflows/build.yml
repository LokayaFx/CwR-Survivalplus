name: CwR Survivalplus

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Packwiz CLI
        run: go install github.com/packwiz/packwiz@latest

      - name: Refresh Packwiz Index
        run: packwiz refresh

      - name: Export Modrinth Pack (.mrpack)
        run: packwiz modrinth export

      - name: Upload Build Artifact (Every Push)
        uses: actions/upload-artifact@v4
        with:
          name: modpack-mrpack
          path: '*.mrpack'

      - name: Create GitHub Release (On Tag Push Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: '*.mrpack'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }
